services:
  postgres:
    image: postgres:18-alpine
    container_name: musicapp-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: musicdb        # Назва БД
      POSTGRES_USER: musicuser    # Користувач
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicuser"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: